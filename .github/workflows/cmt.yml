name: CMT review

# Review every automatic CMT SeismicNow posts for scientific and performance problems
# (`auto-scan --review cmt run`), then, when findings are open, have Claude confirm each one
# in the source and file an issue in ucgmsim/cmt_solutions (prompts/cmt_triage.md).
# The schedule takes only CMTs posted since the last run; older events are reviewed by
# naming them (the `events` input, or a repository_dispatch with `client_payload.events`).
# See README.md, "The CMT review", for what this needs.
on:
  schedule:
    - cron: "22,52 * * * *"  # every 30 minutes, between the simulation scan's runs
  repository_dispatch:
    # e.g. gh api repos/ucgmsim/auto_scan/dispatches -f event_type=cmt-posted \
    #        -F 'client_payload[events]=2026p866048'
    types: [cmt-posted]
  workflow_dispatch:
    inputs:
      events:
        description: "Review these event ids (space-separated), whatever their age. Empty: CMTs posted since the last run."
        type: string
        default: ""
      force:
        description: "Re-review named events even if unchanged since reviewed"
        type: boolean
        default: false
      triage:
        description: "Run the Claude triage when findings are open"
        type: boolean
        default: true
      max-findings:
        description: "Most findings the triage takes on in one run"
        type: number
        default: 5
      model:
        description: "Claude model for the triage"
        type: string
        default: "claude-opus-5-5"

# Both jobs read and write the one cmt.db in the state store: never two runs at once.
concurrency:
  group: cmt
  cancel-in-progress: false

permissions:
  contents: read

env:
  PINNED_RCLONE_VERSION: "1.75.2"
  # sha256 of rclone-v1.75.2-linux-amd64.deb, from https://downloads.rclone.org/v1.75.2/SHA256SUMS
  PINNED_RCLONE_SHA256: "efbfe852181f7191eb3c9043ed1ab49c9b2d0ba045c61c926a5da111c939ec5c"
  AUTO_SCAN_CMT_DB: ${{ github.workspace }}/cmt.db
  AUTO_SCAN_DATASETTE_URL: ${{ vars.DATASETTE_URL }}
  # Event ids from the dispatch input or a repository_dispatch payload; validated before use.
  EVENTS: ${{ inputs.events || github.event.client_payload.events || '' }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      open_findings: ${{ steps.summary.outputs.open_findings }}
    env:
      GH_TOKEN: ${{ secrets.SCAN_GH_TOKEN }}
      AUTO_SCAN_WRITER_TOKEN: ${{ secrets.AUTO_SCAN_WRITER_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync

      - name: Install rclone
        run: |
          deb="rclone-v${PINNED_RCLONE_VERSION}-linux-amd64.deb"
          curl -fsSLo "$RUNNER_TEMP/$deb" "https://downloads.rclone.org/v${PINNED_RCLONE_VERSION}/$deb"
          echo "$PINNED_RCLONE_SHA256  $RUNNER_TEMP/$deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/$deb"
          rclone version
      - name: Configure rclone
        env:
          RCLONE_CONFIG_TEXT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          install -d -m 700 ~/.config/rclone
          umask 077
          printf '%s' "$RCLONE_CONFIG_TEXT" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_OUTPUT"

      # The whole loop: pull, collect what SeismicNow posted since the last run, check,
      # verify, push.
      - name: Review new CMTs
        if: env.EVENTS == ''
        run: uv run --no-sync auto-scan --review cmt run

      - name: Review the named events
        if: env.EVENTS != ''
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          read -ra ids <<< "$EVENTS"
          for id in "${ids[@]}"; do
            [[ "$id" =~ ^[0-9]{4}p[0-9]+$ ]] || { echo "not a GeoNet event id: $id" >&2; exit 1; }
          done
          flags=()
          [ -n "$FORCE" ] && flags+=(--force)
          uv run --no-sync auto-scan --review cmt pull
          uv run --no-sync auto-scan --review cmt collect "${ids[@]}" "${flags[@]}"
          uv run --no-sync auto-scan --review cmt check
          uv run --no-sync auto-scan --review cmt verify
          uv run --no-sync auto-scan --review cmt push

      - id: summary
        name: Summarise the review
        if: always()
        env:
          SINCE: ${{ steps.start.outputs.at }}
        run: |
          if [ ! -f "$AUTO_SCAN_CMT_DB" ]; then
            echo "No cmt.db: the review stopped before it had one." >> "$GITHUB_STEP_SUMMARY"
            echo "open_findings=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv run --no-sync python - <<'EOF'
          import os
          from auto_scan import issues
          from auto_scan.db import connect

          db = connect(os.environ["AUTO_SCAN_CMT_DB"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(issues.summary(db, since=os.environ.get("SINCE") or None).replace("### auto_scan", "### auto_scan CMT review", 1))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"open_findings={len(issues.unfiled_open(db))}\n")
          EOF

  triage:
    needs: review
    if: >-
      needs.review.result == 'success' &&
      fromJSON(needs.review.outputs.open_findings || '0') > 0 &&
      (github.event_name != 'workflow_dispatch' || inputs.triage)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Read, comment on and file issues in ucgmsim/cmt_solutions, and clone it.
      GH_TOKEN: ${{ secrets.SCAN_GH_TOKEN }}
      AUTO_SCAN_WRITER_TOKEN: ${{ secrets.AUTO_SCAN_WRITER_TOKEN }}
      MAX_FINDINGS: ${{ inputs.max-findings || 5 }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: |
          uv sync
          echo ".ai/" >> .git/info/exclude
          mkdir -p .ai

      - name: Install rclone
        run: |
          deb="rclone-v${PINNED_RCLONE_VERSION}-linux-amd64.deb"
          curl -fsSLo "$RUNNER_TEMP/$deb" "https://downloads.rclone.org/v${PINNED_RCLONE_VERSION}/$deb"
          echo "$PINNED_RCLONE_SHA256  $RUNNER_TEMP/$deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/$deb"
      - name: Configure rclone
        env:
          RCLONE_CONFIG_TEXT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          install -d -m 700 ~/.config/rclone
          umask 077
          printf '%s' "$RCLONE_CONFIG_TEXT" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
      - run: gh auth setup-git

      - name: Write the brief
        id: brief
        run: |
          uv run --no-sync auto-scan --review cmt pull
          uv run --no-sync auto-scan --review cmt brief --max-findings "$MAX_FINDINGS" --out .ai/brief.md
          if [ -s .ai/brief.md ]; then
            echo "empty=false" >> "$GITHUB_OUTPUT"
            { echo "### CMT triage brief"; echo; grep '^## Finding' .ai/brief.md; echo; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "Nothing to triage." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Read the prompt
        id: prompt
        if: steps.brief.outputs.empty == 'false'
        run: |
          delimiter="PROMPT_$(openssl rand -hex 16)"
          {
            echo "text<<$delimiter"
            cat prompts/cmt_triage.md
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - id: claude
        if: steps.brief.outputs.empty == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.SCAN_GH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model ${{ inputs.model || 'claude-opus-5-5' }}
            --max-turns 200
            --allowedTools "Read,Write,Glob,Grep,Bash(uv run:*),Bash(git clone:*),Bash(gh repo clone:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git -C:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh label create:*)"

      - name: Push
        if: always() && steps.brief.outputs.empty == 'false'
        run: uv run --no-sync auto-scan --review cmt push

      - name: Summarise Claude's run
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          LOG: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '.[] | select(.type == "result")
            | "### Claude: \(.subtype), \(.num_turns) turns, $\(.total_cost_usd * 100 | round / 100)\n\n\(.result // "(no final message)")\n"
              + (if (.permission_denials // []) == [] then "" else
                 "\nRefused tool calls:\n\n" + (.permission_denials | map("- \(.tool_name): `\(.tool_input | tojson | .[:200])`") | join("\n")) end)' \
            "$LOG" >> "$GITHUB_STEP_SUMMARY"
