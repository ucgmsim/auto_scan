name: CMT review

# Review every automatic CMT SeismicNow posts for scientific and performance problems:
#   review   `auto-scan --review cmt run`: ingest, run the checks, grade each posted solution;
#   explore  one Claude per event not yet read, with its whole download and no checklist
#            (prompts/cmt_explore.md), writing down what it sees;
#   triage   Claude confirms every open finding and every observation in the source and files
#            issues in ucgmsim/cmt_solutions (prompts/cmt_triage.md).
# The schedule takes only CMTs posted since the last run; older events are reviewed by
# naming them (the `events` input, or a repository_dispatch with `client_payload.events`).
# See README.md, "The CMT review", for what this needs.
on:
  schedule:
    - cron: "22,52 * * * *"  # every 30 minutes, between the simulation scan's runs
  repository_dispatch:
    # e.g. gh api repos/ucgmsim/auto_scan/dispatches -f event_type=cmt-posted \
    #        -F 'client_payload[events]=2026p866048'
    types: [cmt-posted]
  workflow_dispatch:
    inputs:
      events:
        description: "Review these event ids (space-separated), whatever their age. Empty: CMTs posted since the last run."
        type: string
        default: ""
      force:
        description: "Re-review named events even if unchanged since reviewed"
        type: boolean
        default: false
      triage:
        description: "Run the Claude triage when findings or observations are open"
        type: boolean
        default: true
      explore:
        description: "Run the open-ended review of events no reviewer has read"
        type: boolean
        default: true
      max-findings:
        description: "Most findings the triage takes on in one run (0: all of them)"
        type: number
        default: 0
      model:
        description: "Claude model for the open-ended review and the triage"
        type: string
        default: "claude-opus-5-5"

# The jobs read and write the one cmt.db in the state store: never two runs at once.
concurrency:
  group: cmt
  cancel-in-progress: false

permissions:
  contents: read

env:
  PINNED_RCLONE_VERSION: "1.75.2"
  # sha256 of rclone-v1.75.2-linux-amd64.deb, from https://downloads.rclone.org/v1.75.2/SHA256SUMS
  PINNED_RCLONE_SHA256: "efbfe852181f7191eb3c9043ed1ab49c9b2d0ba045c61c926a5da111c939ec5c"
  AUTO_SCAN_CMT_DB: ${{ github.workspace }}/cmt.db
  AUTO_SCAN_DATASETTE_URL: ${{ vars.DATASETTE_URL }}
  # Event ids from the dispatch input or a repository_dispatch payload; validated before use.
  EVENTS: ${{ inputs.events || github.event.client_payload.events || '' }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      open_findings: ${{ steps.summary.outputs.open_findings }}
      pending_observations: ${{ steps.summary.outputs.pending_observations }}
      unexplored: ${{ steps.summary.outputs.unexplored }}
    env:
      GH_TOKEN: ${{ secrets.SCAN_GH_TOKEN }}
      AUTO_SCAN_WRITER_TOKEN: ${{ secrets.AUTO_SCAN_WRITER_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync

      - name: Install rclone
        run: |
          deb="rclone-v${PINNED_RCLONE_VERSION}-linux-amd64.deb"
          curl -fsSLo "$RUNNER_TEMP/$deb" "https://downloads.rclone.org/v${PINNED_RCLONE_VERSION}/$deb"
          echo "$PINNED_RCLONE_SHA256  $RUNNER_TEMP/$deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/$deb"
          rclone version
      - name: Configure rclone
        env:
          RCLONE_CONFIG_TEXT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          install -d -m 700 ~/.config/rclone
          umask 077
          printf '%s' "$RCLONE_CONFIG_TEXT" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_OUTPUT"

      # The whole loop: pull, collect what SeismicNow posted since the last run, check,
      # verify, push.
      - name: Review new CMTs
        if: env.EVENTS == ''
        run: uv run --no-sync auto-scan --review cmt run

      - name: Review the named events
        if: env.EVENTS != ''
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          read -ra ids <<< "$EVENTS"
          for id in "${ids[@]}"; do
            [[ "$id" =~ ^[0-9]{4}p[0-9]+$ ]] || { echo "not a GeoNet event id: $id" >&2; exit 1; }
          done
          flags=()
          [ -n "$FORCE" ] && flags+=(--force)
          uv run --no-sync auto-scan --review cmt pull
          uv run --no-sync auto-scan --review cmt collect "${ids[@]}" "${flags[@]}"
          uv run --no-sync auto-scan --review cmt check
          uv run --no-sync auto-scan --review cmt verify
          uv run --no-sync auto-scan --review cmt push

      - id: summary
        name: Summarise the review
        if: always()
        env:
          SINCE: ${{ steps.start.outputs.at }}
        run: |
          if [ ! -f "$AUTO_SCAN_CMT_DB" ]; then
            echo "No cmt.db: the review stopped before it had one." >> "$GITHUB_STEP_SUMMARY"
            { echo "open_findings=0"; echo "pending_observations=0"; echo "unexplored=[]"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv run --no-sync python - <<'EOF'
          import json
          import os
          from auto_scan import issues
          from auto_scan.cmt import observe
          from auto_scan.db import connect

          db = connect(os.environ["AUTO_SCAN_CMT_DB"])
          # At most 24 events a run are read by the open-ended review; the rest wait for the next.
          unexplored = observe.unexplored(db)[:24]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(issues.summary(db, since=os.environ.get("SINCE") or None).replace("### auto_scan", "### auto_scan CMT review", 1))
              out.write(f"- observations awaiting triage: {observe.pending(db)}\n- events to explore: {' '.join(unexplored) or 'none'}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"open_findings={len(issues.unfiled_open(db))}\n")
              out.write(f"pending_observations={observe.pending(db)}\n")
              out.write(f"unexplored={json.dumps(unexplored)}\n")
          EOF

  # The open-ended review: one reviewer per event, told nothing of the checks. Each only
  # reads cmt.db; its observations travel as an artifact and the triage job records them.
  explore:
    needs: review
    if: >-
      needs.review.result == 'success' &&
      needs.review.outputs.unexplored != '' && needs.review.outputs.unexplored != '[]' &&
      (github.event_name != 'workflow_dispatch' || inputs.explore)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        event: ${{ fromJSON(needs.review.outputs.unexplored) }}
    env:
      EVENT: ${{ matrix.event }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: |
          [[ "$EVENT" =~ ^[0-9]{4}p[0-9]+$ ]] || { echo "not a GeoNet event id: $EVENT" >&2; exit 1; }
          uv sync
          echo ".ai/" >> .git/info/exclude
          mkdir -p .ai

      - name: Install rclone
        run: |
          deb="rclone-v${PINNED_RCLONE_VERSION}-linux-amd64.deb"
          curl -fsSLo "$RUNNER_TEMP/$deb" "https://downloads.rclone.org/v${PINNED_RCLONE_VERSION}/$deb"
          echo "$PINNED_RCLONE_SHA256  $RUNNER_TEMP/$deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/$deb"
      - name: Configure rclone
        env:
          RCLONE_CONFIG_TEXT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          install -d -m 700 ~/.config/rclone
          umask 077
          printf '%s' "$RCLONE_CONFIG_TEXT" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Fetch the event and write its sheet
        run: |
          uv run --no-sync auto-scan --review cmt pull
          uv run --no-sync auto-scan --review cmt sheet "$EVENT" --out .ai/sheet.md
          uv run --no-sync auto-scan --review cmt fetch "$EVENT" --out ".ai/cmt/$EVENT"

      - name: Read the prompt
        id: prompt
        run: |
          delimiter="PROMPT_$(openssl rand -hex 16)"
          {
            echo "text<<$delimiter"
            cat prompts/cmt_explore.md
            echo
            echo "The event to review: $EVENT (its download is in .ai/cmt/$EVENT/)."
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # No GitHub or rclone tools: the reviewer reads files and writes one.
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model ${{ inputs.model || 'claude-opus-5-5' }}
            --max-turns 120
            --allowedTools "Read,Write,Glob,Grep,Bash(uv run:*)"

      - name: Check the observations
        run: |
          test -s .ai/observations.json || { echo "the reviewer wrote no .ai/observations.json" >&2; exit 1; }
          uv run --no-sync python -c 'import json, sys; o = json.load(open(".ai/observations.json")); assert isinstance(o, list); print(len(o), "observation(s)")' \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: observations-${{ matrix.event }}
          path: .ai/observations.json
          include-hidden-files: true
          retention-days: 14

  triage:
    needs: [review, explore]
    # Also when some reviewers failed or none ran: the findings don't wait for them.
    if: >-
      !cancelled() && needs.review.result == 'success' &&
      (fromJSON(needs.review.outputs.open_findings || '0') > 0 ||
       fromJSON(needs.review.outputs.pending_observations || '0') > 0 ||
       needs.explore.result == 'success' || needs.explore.result == 'failure') &&
      (github.event_name != 'workflow_dispatch' || inputs.triage)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # Read, comment on and file issues in ucgmsim/cmt_solutions, and clone it.
      GH_TOKEN: ${{ secrets.SCAN_GH_TOKEN }}
      AUTO_SCAN_WRITER_TOKEN: ${{ secrets.AUTO_SCAN_WRITER_TOKEN }}
      MAX_FINDINGS: ${{ inputs.max-findings || 0 }}
      EXPLORED: ${{ needs.review.outputs.unexplored }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: |
          uv sync
          echo ".ai/" >> .git/info/exclude
          mkdir -p .ai

      - name: Install rclone
        run: |
          deb="rclone-v${PINNED_RCLONE_VERSION}-linux-amd64.deb"
          curl -fsSLo "$RUNNER_TEMP/$deb" "https://downloads.rclone.org/v${PINNED_RCLONE_VERSION}/$deb"
          echo "$PINNED_RCLONE_SHA256  $RUNNER_TEMP/$deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/$deb"
      - name: Configure rclone
        env:
          RCLONE_CONFIG_TEXT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          install -d -m 700 ~/.config/rclone
          umask 077
          printf '%s' "$RCLONE_CONFIG_TEXT" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
      - run: gh auth setup-git

      - uses: actions/download-artifact@v4
        if: needs.explore.result == 'success' || needs.explore.result == 'failure'
        with:
          pattern: observations-*
          path: .ai/observations

      # Record what the reviewers saw, and store it at once: it must not depend on the triage.
      # An event whose reviewer failed has no file; `observe` counts the attempt.
      - name: Record the observations
        run: |
          uv run --no-sync auto-scan --review cmt pull
          if [ "${{ needs.explore.result }}" = success ] || [ "${{ needs.explore.result }}" = failure ]; then
            for event in $(jq -r '.[]' <<< "${EXPLORED:-[]}"); do
              [[ "$event" =~ ^[0-9]{4}p[0-9]+$ ]] || continue
              uv run --no-sync auto-scan --review cmt observe "$event" ".ai/observations/observations-$event/observations.json"
            done
            uv run --no-sync auto-scan --review cmt push
          fi

      - name: Write the brief
        id: brief
        run: |
          uv run --no-sync auto-scan --review cmt brief --max-findings "$MAX_FINDINGS" --out .ai/brief.md
          if [ -s .ai/brief.md ]; then
            echo "empty=false" >> "$GITHUB_OUTPUT"
            { echo "### CMT triage brief"; echo; grep -E '^## (Finding|Observation)' .ai/brief.md; echo; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "Nothing to triage." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Read the prompt
        id: prompt
        if: steps.brief.outputs.empty == 'false'
        run: |
          delimiter="PROMPT_$(openssl rand -hex 16)"
          {
            echo "text<<$delimiter"
            cat prompts/cmt_triage.md
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - id: claude
        if: steps.brief.outputs.empty == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.SCAN_GH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model ${{ inputs.model || 'claude-opus-5-5' }}
            --max-turns 800
            --allowedTools "Read,Write,Glob,Grep,Bash(uv run:*),Bash(git clone:*),Bash(gh repo clone:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git -C:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh label create:*)"

      - name: Push
        if: always() && steps.brief.outputs.empty == 'false'
        run: uv run --no-sync auto-scan --review cmt push

      - name: Summarise Claude's run
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          LOG: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '.[] | select(.type == "result")
            | "### Claude: \(.subtype), \(.num_turns) turns, $\(.total_cost_usd * 100 | round / 100)\n\n\(.result // "(no final message)")\n"
              + (if (.permission_denials // []) == [] then "" else
                 "\nRefused tool calls:\n\n" + (.permission_denials | map("- \(.tool_name): `\(.tool_input | tojson | .[:200])`") | join("\n")) end)' \
            "$LOG" >> "$GITHUB_STEP_SUMMARY"
